# ============================================================
#  TP GitHub Actions : construire le front (React + Vite)
#  Se déclenche à chaque push sur une branche.
#  Un seul job : installer, compiler, vérifier dist/, publier.
# ============================================================

name: Construire le front

# Déclencheur : uniquement un push sur une branche (pas sur un tag).
on:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build du front
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code du dépôt dans la machine virtuelle.
      - name: Récupérer le code
        uses: actions/checkout@v4

      # 2. Installer Node.js (même version que le Dockerfile : Node 22).
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Installer les dépendances exactement comme dans package-lock.json.
      - name: Installer les dépendances
        run: npm ci

      # 4. Compiler le front : Vite écrit le résultat dans dist/.
      - name: Construire le front
        run: npm run build

      # 5. Vérifier que dist/ existe et contient les fichiers attendus.
      - name: Vérifier le dossier dist
        run: |
          test -d dist
          test -f dist/index.html
          test -n "$(ls dist/assets/*.js 2>/dev/null)"
          test -n "$(ls dist/assets/*.css 2>/dev/null)"
          echo "Contenu de dist/ :"
          ls -R dist

      # 6. Publier dist/ comme artefact téléchargeable depuis le run.
      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
